name: Check links

on:
  push:
    branches: [main]
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Offline: only links between files in this repo. Template links contain {{tokens}}, so skip URLs with braces.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --exclude '%7B' --exclude '\{'
            --root-dir '${{ github.workspace }}'
            './**/*.md'
